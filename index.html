<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週次美容業界動向レポート ｜ アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#c98a9c;
    --rose-deep:#a8617a;
    --gold:#c9a86a;
    --cream:#faf6f1;
    --ink:#2e2622;
    --ink-soft:#6b5d55;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    min-height:100vh;
    background:radial-gradient(circle at 20% 10%, #f7e9ec 0%, #f3ece3 45%, #ece2d6 100%);
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  body{display:flex;flex-direction:column;align-items:center;padding:48px 20px 64px;}
  .header{text-align:center;max-width:720px;margin-bottom:40px;}
  .header .eyebrow{font-family:'Cormorant Garamond',serif;letter-spacing:.35em;font-size:13px;color:var(--rose-deep);text-transform:uppercase;margin-bottom:10px;}
  .header h1{font-family:'Noto Serif JP',serif;font-weight:700;font-size:clamp(26px,5vw,40px);letter-spacing:.04em;line-height:1.4;}
  .header .sub{margin-top:12px;font-size:13px;color:var(--ink-soft);letter-spacing:.05em;}

  .archive-list{width:100%;max-width:720px;display:flex;flex-direction:column;gap:16px;}
  .archive-card{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.7);
    border-radius:18px;padding:22px 26px;text-decoration:none;color:var(--ink);
    box-shadow:0 16px 40px -20px rgba(120,70,90,0.35);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .archive-card:hover{transform:translateY(-3px);border-color:var(--rose);box-shadow:0 20px 44px -18px rgba(120,70,90,0.45);}
  .archive-card.latest{border:1px solid var(--rose-deep);}
  .archive-card .info{flex-grow:1;}
  .archive-card .badge{
    display:inline-block;font-size:11px;letter-spacing:.1em;color:#fff;
    background:linear-gradient(135deg,var(--rose-deep),var(--gold));
    padding:4px 14px;border-radius:100px;font-weight:500;margin-bottom:10px;
  }
  .archive-card h2{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;margin-bottom:6px;line-height:1.55;}
  .archive-card .period{font-size:12px;color:var(--ink-soft);letter-spacing:.03em;}
  .archive-card .arrow{font-size:22px;color:var(--rose-deep);flex-shrink:0;}
  .footer-note{margin-top:48px;font-size:11px;color:var(--ink-soft);text-align:center;opacity:.75;line-height:1.8;}
</style>
</head>
<body>

  <div class="header">
    <div class="eyebrow">Weekly Beauty Industry Report</div>
    <h1>週次美容業界動向レポート</h1>
    <div class="sub">美容室経営者のための業界動向アーカイブ</div>
  </div>

  <div class="archive-list" id="archiveList">

    <a class="archive-card latest" href="reports/beauty-weekly-2026-11-10.html">
      <div class="info">
        <span class="badge">最新号</span>
        <h2>美容室倒産54件・「106万円の壁」賃金要件撤廃・休眠美容師56.4%・秋冬はレイヤー×ボルドー系ほか</h2>
        <div class="period">2026年10月 〜 11月10日 ｜ 全7件</div>
      </div>
      <div class="arrow">→</div>
    </a>

  </div>

  <div class="footer-note">
    毎週更新予定 ｜ 本サイトは公開情報をもとにした要約レポートです
  </div>

</body>
</html>
